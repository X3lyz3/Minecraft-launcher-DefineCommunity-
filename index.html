<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com">
    <link rel="stylesheet" href="style.css">
    <title>Define Community — лаунчер</title>
</head>
<body>
<main class="app">
    <header class="brand">
        <div>
            <h1>Define Community</h1>
            <p>Minecraft 26.3 · Fabric</p>
        </div>
        <span class="badge" id="sys-badge"></span>
    </header>

    <section class="grid">
        <div class="card">
            <h2>Гравець</h2>
            <label for="username">Нікнейм</label>
            <input type="text" id="username" maxlength="16" autocomplete="off" spellcheck="false">
            <p class="hint" id="name-hint">Від 3 до 16 символів: латиниця, цифри, підкреслення.</p>

            <h2>Вікно гри</h2>
            <div class="presets" id="presets">
                <button type="button" data-w="1280" data-h="720">1280×720</button>
                <button type="button" data-w="1600" data-h="900">1600×900</button>
                <button type="button" data-w="1920" data-h="1080">1920×1080</button>
            </div>
            <div class="row">
                <div><label for="res-w">Ширина</label><input type="number" id="res-w" min="640" max="7680"></div>
                <div><label for="res-h">Висота</label><input type="number" id="res-h" min="480" max="4320"></div>
            </div>
            <label class="check"><input type="checkbox" id="fullscreen"><span>Повноекранний режим</span></label>
        </div>

        <div class="card">
            <h2>Оперативна пам’ять</h2>
            <div class="ram-value"><span id="ram-gb">4</span><small>ГБ</small></div>
            <input type="range" id="ram" step="512">
            <div class="ticks"><span id="ram-min"></span><span id="ram-max"></span></div>
            <p class="hint" id="ram-hint"></p>

            <h2>Тека гри</h2>
            <div class="row path">
                <input type="text" id="game-path" spellcheck="false">
                <button type="button" class="ghost" id="browse-btn">Обрати</button>
            </div>
            <p class="hint">Якщо обрати теку, усередині створиться підтека DefineMC.</p>
        </div>
    </section>

    <footer class="bottom">
        <div class="status">
            <div class="bar"><i id="bar-fill"></i></div>
            <p id="status-text">Готовий до запуску</p>
        </div>
        <button type="button" id="play-btn">Грати</button>
    </footer>
</main>

<script>
const { ipcRenderer } = require('electron');
const os = require('os');
const $ = id => document.getElementById(id);

// ---------- Пам’ять ----------
const totalMb = Math.floor(os.totalmem() / 1048576);
const ramMax = Math.max(2048, Math.min(16384, Math.floor(totalMb * 0.75 / 512) * 512));
const ramMin = ramMax >= 2048 ? 1024 : 512;
const ram = $('ram');
ram.min = ramMin; ram.max = ramMax;

const fmtGb = mb => (mb / 1024).toFixed(mb % 1024 ? 1 : 0).replace('.', ',');

function updateRam() {
    const v = Number(ram.value);
    ram.style.setProperty('--p', ((v - ramMin) / (ramMax - ramMin) * 100) + '%');
    $('ram-gb').textContent = fmtGb(v);
    const hint = $('ram-hint');
    if (v < 3072) { hint.textContent = 'Замало для збірки з модами — можливі лаги.'; hint.className = 'hint warn'; }
    else if (v > totalMb * 0.6) { hint.textContent = 'Забагато: системі може не вистачити пам’яті.'; hint.className = 'hint warn'; }
    else { hint.textContent = 'Для цієї збірки вистачить 4–6 ГБ.'; hint.className = 'hint'; }
}
$('ram-min').textContent = fmtGb(ramMin) + ' ГБ';
$('ram-max').textContent = fmtGb(ramMax) + ' ГБ';
$('sys-badge').textContent = `У системі ${fmtGb(totalMb)} ГБ ОЗП`;

// ---------- Налаштування (зберігаються між запусками) ----------
const defaults = { username: 'Engineer', ram: 4096, path: 'C:\\DefineMC', w: 1280, h: 720, full: false };
let saved = {};
try { saved = JSON.parse(localStorage.getItem('launcher') || '{}'); } catch (e) {}
const s = { ...defaults, ...saved };

$('username').value = s.username;
ram.value = Math.min(ramMax, Math.max(ramMin, s.ram));
$('game-path').value = s.path;
$('res-w').value = s.w;
$('res-h').value = s.h;
$('fullscreen').checked = s.full;
updateRam();

function save() {
    localStorage.setItem('launcher', JSON.stringify({
        username: $('username').value, ram: Number(ram.value), path: $('game-path').value,
        w: Number($('res-w').value), h: Number($('res-h').value), full: $('fullscreen').checked
    }));
}
document.querySelectorAll('input').forEach(el => el.addEventListener('change', save));
ram.addEventListener('input', () => { updateRam(); });

// ---------- Роздільна здатність ----------
function markPreset() {
    document.querySelectorAll('#presets button').forEach(b =>
        b.classList.toggle('on', b.dataset.w === $('res-w').value && b.dataset.h === $('res-h').value));
    const f = $('fullscreen').checked;
    $('res-w').disabled = $('res-h').disabled = f;
}
$('presets').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $('res-w').value = b.dataset.w; $('res-h').value = b.dataset.h;
    markPreset(); save();
});
['res-w', 'res-h', 'fullscreen'].forEach(id => $(id).addEventListener('input', markPreset));
markPreset();

// ---------- Тека ----------
$('browse-btn').addEventListener('click', async () => {
    const folder = await ipcRenderer.invoke('select-folder');
    if (!folder) return;
    const sep = folder.endsWith('\\') ? '' : '\\';
    $('game-path').value = /DefineMC$/i.test(folder) ? folder : folder + sep + 'DefineMC';
    save();
});

// ---------- Запуск ----------
const btn = $('play-btn');
function setStatus(text, err) {
    const el = $('status-text');
    el.textContent = text; el.className = err ? 'err' : '';
}
function resetBtn() { btn.textContent = 'Грати'; btn.disabled = false; }

btn.addEventListener('click', () => {
    const name = $('username').value.trim();
    if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) {
        $('name-hint').className = 'hint warn'; $('username').focus();
        return setStatus('Перевірте нікнейм.', true);
    }
    $('name-hint').className = 'hint';
    const w = Math.min(7680, Math.max(640, Number($('res-w').value) || 1280));
    const h = Math.min(4320, Math.max(480, Number($('res-h').value) || 720));
    $('res-w').value = w; $('res-h').value = h;
    save();

    btn.textContent = 'Запуск…'; btn.disabled = true;
    $('bar-fill').style.width = '0%';
    setStatus('Підготовка файлів…');
    ipcRenderer.send('start-game', {
        username: name, ram: Number(ram.value), path: $('game-path').value.trim(),
        width: w, height: h, fullscreen: $('fullscreen').checked
    });
});

ipcRenderer.on('progress', (e, d) => {
    const pct = d.total ? Math.round(d.task / d.total * 100) : 0;
    $('bar-fill').style.width = pct + '%';
    setStatus(`Завантаження (${d.type}): ${d.task} з ${d.total}`);
});
ipcRenderer.on('started', () => {
    $('bar-fill').style.width = '100%';
    btn.textContent = 'Гру запущено';
    setStatus('Гру запущено. Вікно з’явиться за кілька секунд.');
});
ipcRenderer.on('log', (e, msg) => setStatus(String(msg).slice(0, 140)));
ipcRenderer.on('closed', (e, code) => {
    resetBtn();
    $('bar-fill').style.width = '0%';
    setStatus(code === 0 ? 'Гру закрито.' : `Гра завершилася з помилкою (код ${code}).`, code !== 0);
});
ipcRenderer.on('error', (e, msg) => { resetBtn(); setStatus(msg, true); });
</script>
</body>
</html>
